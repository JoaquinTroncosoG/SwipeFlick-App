name: Build Android APK (SwipeFlick)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Analysis & Tests
        run: |
          flutter analyze
          flutter test
        continue-on-error: true

      - name: Build Android APK (Release Universal)
        run: |
          set -o pipefail
          flutter build apk --release --android-skip-build-dependency-validation 2>&1 | tee build_output.log

      - name: Report Build Diagnostics on Failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 120 build_output.log > error_summary.txt
          gh issue create --title "Android Build Diagnostic Log" --body-file error_summary.txt || true

      - name: Prepare APK File
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SwipeFlick-v1.10.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwipeFlick-Android-APK
          path: build/app/outputs/flutter-apk/SwipeFlick-v1.10.0.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.10.0-apk build/app/outputs/flutter-apk/SwipeFlick-v1.10.0.apk --title "SwipeFlick v1.10.0 (APK Android)" --notes "Descarga directa de SwipeFlick-v1.10.0.apk para instalar y probar en tu celular Android." --clobber
