name: Build Android APK (SwipeFlick)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Analysis & Tests
        run: |
          flutter analyze
          flutter test
        continue-on-error: true

      - name: Build Android APK (Release Universal)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
        run: |
          set -o pipefail
          flutter build apk --release --android-skip-build-dependency-validation \
            --dart-define=MONGODB_URI="$MONGODB_URI" \
            --dart-define=BREVO_API_KEY="$BREVO_API_KEY" \
            --dart-define=BREVO_SENDER_EMAIL="$BREVO_SENDER_EMAIL" \
            2>&1 | tee build_output.log || {
            echo "Checking if APK was generated by Gradle..."
            find . -name "*.apk"
            APK_FILE=$(find . -name "*release*.apk" | head -n 1)
            if [ -n "$APK_FILE" ]; then
              echo "Found APK at $APK_FILE"
              mkdir -p build/app/outputs/flutter-apk
              cp "$APK_FILE" build/app/outputs/flutter-apk/app-release.apk
            else
              echo "No APK found, failing step"
              exit 1
            fi
          }

      - name: Report Build Diagnostics on Failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 120 build_output.log > error_summary.txt
          gh issue create --title "Android Build Diagnostic Log" --body-file error_summary.txt || true

      - name: Prepare APK File
        run: |
          mkdir -p build/app/outputs/flutter-apk
          APK_FILE=$(find . -name "*release*.apk" -o -name "app-release.apk" | head -n 1)
          echo "Found APK file to package: $APK_FILE"
          cp "$APK_FILE" build/app/outputs/flutter-apk/SwipeFlick-v1.13.0.apk
          ls -lh build/app/outputs/flutter-apk/SwipeFlick-v1.13.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwipeFlick-Android-APK
          path: build/app/outputs/flutter-apk/SwipeFlick-v1.13.0.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.13.0-apk --yes || true
          git tag -d v1.13.0-apk 2>/dev/null || true
          git push origin :refs/tags/v1.13.0-apk 2>/dev/null || true
          gh release create v1.13.0-apk build/app/outputs/flutter-apk/SwipeFlick-v1.13.0.apk --title "SwipeFlick v1.13.0 (APK Android)" --notes "Descarga directa de SwipeFlick-v1.13.0.apk para instalar y probar en tu celular Android."
