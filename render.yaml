# Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: swipeflick-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: joaquin1troncoso@gmail.com
      - key: PORT
        value: 10000
